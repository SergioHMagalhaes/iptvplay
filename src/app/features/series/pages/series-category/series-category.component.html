<main class="grid gap-6 px-4 pt-5 pb-8 lg:px-10 lg:pt-8 lg:pb-12">
  <header>
    <h1 class="m-0 text-[1.75rem] lg:text-[2rem]">
      {{ category()?.name ?? "Categoria" }}
    </h1>
  </header>

  <section
    class="grid grid-cols-3 gap-4 sm:grid-cols-4 min-[700px]:grid-cols-6 lg:grid-cols-8 lg:gap-5 min-[1200px]:grid-cols-10"
  >
    @for (item of series(); track item.id ?? item.externalId) {
      <app-poster-card class="!w-[108px]" [name]="item.name" [imageUrl]="item.imageUrl" />
    }
  </section>

  @if (isLoading()) {
    <p class="m-0 text-white/70">Carregando...</p>
  }

  @if (hasMoreSeries()) {
    <div appLazyLoadTrigger (reached)="loadMoreSeries()" class="h-px" aria-hidden="true"></div>
  }
</main>
