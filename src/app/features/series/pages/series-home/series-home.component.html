<main class="grid gap-8 overflow-x-hidden px-4 pt-5 pb-8 md:gap-10 md:px-10 md:pt-8 md:pb-12">
  @if (errorMessage(); as error) {
    <p class="m-0 text-[#ff5c62]">
      {{ error }}
    </p>
  }

  @for (section of sections(); track section.category.externalId) {
    <section class="grid w-full min-w-0 gap-4">
      <div class="flex items-center gap-8">
        <h2 class="m-0 truncate text-[1.1rem] md:text-[1.25rem]">
          {{ section.category.name }}
        </h2>

        <button
          type="button"
          class="shrink-0 bg-transparent font-bold"
          (click)="openCategory(section.category.externalId)"
        >
          Veja mais &gt;
        </button>
      </div>

      <app-poster-carousel
        [items]="section.items"
        (loadMore)="loadMoreSeries(section.category.externalId)"
        (selected)="openSeries($event)"
      />
    </section>
  }

  @if (isLoading()) {
    <section class="grid w-full gap-8">
      @for (_ of [1, 2, 3]; track $index) {
        <section class="grid w-full min-w-0 gap-4">
          <div class="flex items-center gap-8">
            <div class="skeleton h-6 w-40 md:w-56"></div>
            <div class="skeleton h-5 w-24"></div>
          </div>

          <div class="flex gap-4 overflow-hidden">
            @for (_ of [1, 2, 3, 4, 5, 6]; track $index) {
              <div class="grid w-[140px] shrink-0 gap-2 md:w-[180px]">
                <div class="skeleton aspect-[2/3] w-full rounded-xl"></div>
                <div class="skeleton h-4 w-4/5"></div>
                <div class="skeleton h-3 w-3/5"></div>
              </div>
            }
          </div>
        </section>
      }
    </section>
  }

  @if (hasMoreCategories()) {
    <div appLazyLoadTrigger (reached)="loadMoreCategories()" class="h-px" aria-hidden="true"></div>
  }
</main>
