<header class="relative flex h-16 items-center justify-between bg-base-100 px-4 text-base-content sm:px-7">
  <img class="h-[22px] w-[68px]" src="/assets/logos/iptvplay-logo.svg" alt="iptvplay" />

  <h1 class="pointer-events-none absolute left-1/2 -translate-x-1/2 text-xl font-bold">
    {{ title() }}
  </h1>

  <button
    type="button"
    class="btn btn-ghost btn-circle min-h-10 h-10 w-10"
    aria-label="Abrir listas"
    (click)="openPlaylists()"
  >
    <svg lucideSettings aria-hidden="true"></svg>
  </button>
</header>
