<div class="w-[101vw] overflow-x-hidden">
  <swiper-container
    #swiperContainer
    class="pr-4"
    slides-per-view="2.2"
    space-between="12"
    slides-offset-after="16"
    breakpoints='{
      "640":{"slidesPerView":3.2,"spaceBetween":16},
      "1024":{"slidesPerView":5.2,"spaceBetween":20},
      "1280":{"slidesPerView":6.2,"spaceBetween":20}
    }'
    (swiperslidechange)="onSlideChange($event)"
    (swiperslideslengthchange)="onSlidesUpdated()"
    (reachend)="onReachEnd()"
  >
    @for (item of items(); track item.id ?? item.externalId) {
      <swiper-slide class="!w-[95px] cursor-pointer sm:!w-[108px]" (click)="selectItem(item)">
        <app-poster-card [tv]="tv()" [name]="item.name" [imageUrl]="item.imageUrl" />
      </swiper-slide>
    }
  </swiper-container>
</div>
